<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <title>Railway Map</title>

    <link
        href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"
        rel="stylesheet"
    >

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<script>

const map = new maplibregl.Map({
    container: "map",
    style: "https://tiles.openfreemap.org/styles/liberty",
    center: [5.3, 52.2],
    zoom: 7
});

map.on("load", () => {

    fetch("case_study_network.geojson")
        .then((response) => response.json())
        .then((network) => {
            map.addSource("railways", {
                type: "geojson",
                data: network
            });

            map.addLayer({
                id: "my-railways",
                type: "line",
                source: "railways",
                filter: ["==", ["get", "feature_type"], "track"],
                paint: {
                    "line-color": [
                        "match",
                        ["get", "direction"],
                        "Up", "#ff0000",
                        "Down", "#0000ff",
                        "reversible", "#000000",
                        "#808080"
                    ],
                    "line-width": 5,
                    "line-opacity": 1
                }
            });
        });

    const popup = new maplibregl.Popup({
    closeButton: false,
    closeOnClick: false
    });

    map.on("mouseenter", "my-railways", (e) => {

        map.getCanvas().style.cursor = "pointer";

        const feature = e.features[0];

        // Get all attributes
        const properties = feature.properties;

        let html = "<strong>Railway section</strong><br><br>";

        if (properties.segment_ids !== undefined && properties.segment_ids !== null) {
            html += `<strong>Segment IDs:</strong> ${properties.segment_ids}<br>`;
        }

        for (const [key, value] of Object.entries(properties)) {

            if (value !== null && value !== "") {
                html += `<strong>${key}:</strong> ${value}<br>`;
            }
        }

        popup
            .setLngLat(e.lngLat)
            .setHTML(html)
            .addTo(map);
    });

    map.on("mousemove", "my-railways", (e) => {

        if (e.features.length > 0) {
            popup.setLngLat(e.lngLat);
        }
    });

    map.on("mouseleave", "my-railways", () => {

        map.getCanvas().style.cursor = "";
        popup.remove();

    });

});

map.on("error", (e) => {
    console.error("MapLibre error:", e);
});

</script>

</body>
</html>
